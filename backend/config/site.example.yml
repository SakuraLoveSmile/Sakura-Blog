# 站点配置模板，对应 internal/config/site.go 的 DefaultSite()。
# 复制为 site.yml 后填值：cp config/site.example.yml config/site.yml
# site.yml 含密钥（admin 密码 / SMTP 密码）、不受 git 跟踪；本 example 仅跟踪结构与安全默认值。
# 启动时由 config.LoadSite 加载；文件缺失/解析失败时 fallback 到 DefaultSite()。
# 注意：# 开头的值（如主题色）必须加引号；raw HTML（如 social icon）用单引号包裹。

title: Stellar Demo
subtitle: Go 服务端渲染
description: 用 Go (Gin) + html/template + goldmark 重建 Stellar 风格博客，验证服务端渲染链路。
# ❗ 生产必填：canonical/OG/sitemap/feed/JSON-LD 均依赖此基址生成绝对 URL。
# 空值时 release 模式启动会告警，并回退 http://<request-host>（搜索引擎可能收录为 http）。
# 示例：url: https://blog.example.com
url: ""
avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
# 头像 hover 旋转背景图，对应原版 style.animated_avatar.background（animate: auto）
avatar_bg: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/rainbow64@3x.webp
logo_title: Stellar Demo
# 含 | 时拆 normal/hover 两段，鼠标 hover 标题时向上滚动切换（原版 logo.ejs 机制）
logo_sub: Go SSR 验证|Stellar 主题

menubar:
  columns: 2
  items:
    - id: post
      title: 博客
      url: /
      icon: solar:documents-bold-duotone
      theme: "#1BCDFC"
    - id: wiki
      title: 文库
      url: /wiki
      icon: solar:notebook-bookmark-bold-duotone
      theme: "#3DC550"
    - id: notes
      title: 笔记
      url: /notes
      icon: default:edit
      theme: "#FA7D23"
    - id: friends
      title: 友链
      url: /friends
      icon: solar:planet-bold-duotone
      theme: "#FF6B9D"

# 右栏（site.yml rightbar 段）
rightbar:
  # 欢迎语卡片内的链接列表（对齐原版 markdown widget 的 linklist）。columns 留空=按链接数
  welcome_linklist:
    items:
      - title: 查看文库
        url: /wiki
        icon: solar:notebook-bookmark-bold-duotone
      - title: 传送到笔记
        url: /notes
        icon: default:edit

# 文库项目（配置驱动，不入库）。每个项目一张卡片，点击跳到 url（站内文章/页面或外链）。
# repo（可选）：GitHub 仓库（owner/name 格式），配置后 wiki 文档页右栏渲染 ghrepo 仓库卡片。
wiki:
  - id: stellar
    title: Stellar 主题文档
    description: Hexo Stellar 主题的使用文档与配置说明。
    icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
    tags: [主题, 前端]
    url: https://xaoxuu.com/wiki/stellar/
    sort: 100
  - id: go-blog
    title: Go 博客重构笔记
    description: 用 Go(Gin)+html/template+goldmark 复刻 Stellar 的实现记录。
    icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg
    tags: [后端, Go]
    repo: sakurasep/blog
    url: /archives/
    sort: 90
  - id: frontend
    title: 前端拾遗
    description: CSS 变量、PJAX、懒加载等前端细节整理。
    icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
    tags: [前端]
    url: /categories/
    sort: 80

# 友链动态聚合（/friends 页）。refresh_interval：后端抓取友链 RSS 的刷新间隔（分钟），缺省 60。
# posts_per_link：每个友链展示的最新文章数，缺省 20。
friends:
  refresh_interval: 60
  posts_per_link: 20

# 友情链接（配置驱动，不入库）。头像缺省时模板用主题默认占位图。
# rss 非空时，/friends 页后端会定时抓取该友链 RSS/Atom 最新文章并聚合展示；label/color 为分类标签与配色（16 进制不带 #）。
links:
  - title: 我的朋友
    items:
      - name: xaoxuu
        url: "https://xaoxuu.com/"
        avatar: "https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg"
        desc: Stellar 主题作者
        rss: "https://xaoxuu.com/atom.xml"
        label: 主题
        color: FF6B9D
      - name: Hexo
        url: "https://hexo.io/"
        avatar: "https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg"
        desc: 快速、简洁且高效的博客框架
        rss: "https://hexo.io/atom.xml"
        label: 框架
        color: 1BCDFC
  - title: 推荐站点
    items:
      - name: Go
        url: "https://go.dev/"
        avatar: "https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg"
        desc: The Go Programming Language
        rss: "https://go.dev/blog/feed.atom"
        label: 语言
        color: 3DC550

# 多作者体系（Spec 38）：key 为作者 ID，文章 front matter 中 author: <id> 引用。
# authors 为空时全站行为不变（回退站长）。
authors:
  sakura:
    name: Sakura
    avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
    description: 博客作者

# 导航栏标签页（Spec 50）：两种形状——
#   旧形状（向后兼容，缺省追加）：nav_tabs: [{title, url, external}]，追加在固定 tab（归档）之后；
#   新形状：nav_tabs: {enable_custom: true, items: [...]}，enable_custom=true 时导航栏
#   完全由 items 定义（不再渲染固定 tab）。items 支持 icon（icons.yml key）与
#   active_rules（路径前缀/正则列表，任一命中即高亮；缺省按 url 精确匹配）。
