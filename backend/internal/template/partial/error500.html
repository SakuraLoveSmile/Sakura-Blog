{{- /* error500.html: 自定义 500 页（P1-8），由 base.html 按 .Page.Layout == "500" 分派渲染。
   结构对齐 error404.html；不暴露内部错误细节，仅展示友好提示。*/ -}}
<article class="md-text error-page">
  {{if .Site.Style.ErrorPage}}<img src="{{.Site.Style.ErrorPage}}" alt="" style="max-width:16rem;max-height:12rem;object-fit:contain" onerror="this.style.display='none'">{{end}}
  <h1 style="font-size:4rem;font-weight:700;color:#fdb62f;">500</h1>
  <p class="what">
    <strong>{{- lang "error500.what" -}}</strong>
  </p>
  <p class="why">{{- lang "error500.why" -}}</p>
  <br><br>
  <a class="button" id="back" href="/">{{- lang "page.error.action" -}}</a>
</article>
