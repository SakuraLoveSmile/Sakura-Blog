# Go API types are the source of truth for generated Console declarations.
type_mappings:
  time.Time: string
  time.Duration: number

packages:
  - path: "blog/modules/console/api"
    output_path: "../../../packages/api-client/src/generated.d.ts"
    fallback_type: unknown
    preserve_comments: types
    include_files:
      - "errors.go"
      - "registration_invites.go"
      - "module.go"
      - "shortcode_catalog.go"
      - "shortcode_edit.go"
      - "uc.go"
      - "plugin_runtime.go"
      - "rag.go"
      - "editor_import.go"
      - "stellar_import.go"
      - "page.go"
      - "update.go"
      - "settings.go"
      - "author_catalog.go"
      - "stellar_settings.go"
      - "stellar_content.go"
      - "stellar_widget_preview.go"
      - "preview.go"
      - "notebook.go"
      - "notebook_note.go"
      - "backup_restores.go"
      - "backup.go"
