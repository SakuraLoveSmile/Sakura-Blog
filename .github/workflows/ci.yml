name: CI

on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches: [main, dev]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # modules/console/web/embed.go 的 //go:embed all:dist 编译期要求 dist 非空；
      # vet/test/编译验证不需要真实前端产物，占位文件即可。
      - name: Stub modules/console/web/dist for go:embed
        run: mkdir -p modules/console/web/dist && echo '<!doctype html>' > modules/console/web/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check module dependency direction
        run: sh scripts/check-module-deps.sh

      - name: Build
        run: go build -o blog ./cmd/blog

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modules/console/web/package-lock.json

      - name: Install & build (vue-tsc + vite)
        run: cd modules/console/web && npm ci && npm run build

      # 与 make test 的前端行为面对齐：
      # console-test = npm run test（vue-tsc 类型检查 + node --test，复用上面的 npm ci 环境）
      # assets-test = node --test modules/stellar/web/scripts/test/*.test.mjs（node:test 内置运行器，零依赖）
      - name: Console behavior tests (npm run test)
        run: cd modules/console/web && npm run test

      - name: Assets behavior tests (node --test)
        run: node --test modules/stellar/web/scripts/test/*.test.mjs

  # 与发布产物同构的组合构建验证（对齐 release.yml：真实 console 产物 + go build）。
  # go job 用 stub dist 只验证编译；此 job 保证合入主线前 embed 真实前端产物可构建。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Console SPA（go:embed 编译期要求 modules/console/web/dist 非空）----
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modules/console/web/package-lock.json

      - name: Build console
        run: cd modules/console/web && npm ci && npm run build

      # ---- Go 编译（与 release.yml 同构，CGO 可关）----
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary (embed real modules/console/web dist)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o blog ./cmd/blog
