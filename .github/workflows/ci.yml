name: CI

on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches: [main, dev, release]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # modules/console/web/embed.go 的 //go:embed all:dist 编译期要求 dist 非空；
      # vet/test/编译验证不需要真实前端产物，占位文件即可。
      - name: Stub modules/console/web/dist for go:embed
        run: mkdir -p modules/console/web/dist && echo '<!doctype html>' > modules/console/web/dist/index.html

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Test
        run: go test ./...

      - name: Check module dependency direction
        run: sh scripts/check-module-deps.sh

      - name: Build
        run: go build -o blog ./cmd/blog

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: vue-tsc
        run: pnpm --filter console exec vue-tsc -b

      - name: Build publishable plugin runtime package
        run: pnpm --filter @blog/plugin-runtime run build

      - name: Build externalized plugin bundle contract
        run: pnpm --filter console run build:plugin

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Stub modules/console/web/dist for staticcheck
        run: mkdir -p modules/console/web/dist && echo '<!doctype html>' > modules/console/web/dist/index.html

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Current-tree release secret check
        run: bash scripts/check-release-secrets.sh

      - name: Git history release secret check
        run: bash scripts/check-release-secrets-history.sh

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Console (vue-tsc + vite)
        run: pnpm --filter console run build

      # 与 make test 的前端行为面对齐：
      # console-test = pnpm run test（vue-tsc 类型检查 + node --test，复用上面的 pnpm 环境）
      # assets-test = node --test modules/stellar/tests/*.test.mjs（node:test 内置运行器，零依赖）
      - name: Console behavior tests (pnpm run test)
        run: pnpm --filter console run test

      - name: Assets behavior tests (node --test)
        run: node --test modules/stellar/tests/*.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Console assets
        run: pnpm --filter console run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run critical path e2e
        run: pnpm run e2e

  # 与发布产物同构的组合构建验证（对齐 release.yml：真实 console 产物 + go build）。
  # go job 用 stub dist 只验证编译；此 job 保证合入主线前 embed 真实前端产物可构建。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      # ---- Console SPA（go:embed 编译期要求 modules/console/web/dist 非空）----
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build console
        run: pnpm --filter console run build

      # ---- Go 编译（与 release.yml 同构，CGO 可关）----
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary (embed real modules/console/web dist)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o blog ./cmd/blog

  # release 只能由 main 晋级；该检查只在目标分支为 release 的 PR 上运行。
  release-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require main from this repository as release source
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: bash scripts/check-release-source.sh
