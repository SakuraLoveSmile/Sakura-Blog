name: CI

on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches: [main, dev]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      # frontend/console/embed.go 的 //go:embed all:dist 编译期要求 dist 非空；
      # vet/test/编译验证不需要真实前端产物，占位文件即可。
      - name: Stub frontend/console/dist for go:embed
        run: mkdir -p frontend/console/dist && echo '<!doctype html>' > frontend/console/dist/index.html

      # go.work workspace 下 ./... 不匹配 use 的 module，须显式列出 backend/frontend 包路径。
      - name: Vet
        run: go vet ./backend/... ./frontend/...

      - name: Test
        run: go test ./backend/... ./frontend/...

      - name: Build
        run: go build -o blog ./backend/cmd/server

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json

      - name: Install & build (vue-tsc + vite)
        run: cd frontend/console && npm ci && npm run build

  # 与发布产物同构的组合构建验证（对齐 release.yml：真实 console 产物 + go build）。
  # go job 用 stub dist 只验证编译；此 job 保证合入主线前 embed 真实前端产物可构建。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Console SPA（go:embed 编译期要求 frontend/console/dist 非空）----
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json

      - name: Build console
        run: cd frontend/console && npm ci && npm run build

      # ---- Go 编译（与 release.yml 同构，CGO 可关）----
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Build binary (embed real frontend/console dist)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o blog ./backend/cmd/server
