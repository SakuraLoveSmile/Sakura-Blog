name: Release Build

# release 分支推送 / 打 tag / 手动触发均可构建。
# 产物：Linux amd64 单二进制（go:embed 全部资源）+ GitHub Release。
# 服务器通过 deploy/update.sh 定时检查 Release 并自动下载更新。
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release + 生成 release notes
      id-token: write   # GitHub Artifact Attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      # ---- Console SPA（go:embed 编译期要求 modules/console/web/dist 非空）----
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build console
        run: pnpm --filter console run build

      # ---- Go 交叉编译（sqlite 纯 Go 实现，CGO 可关）----
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X blog/internal/app.Version=${GITHUB_REF_NAME}" \
            -o blog-linux-amd64 ./cmd/blog
          sha256sum blog-linux-amd64 > blog-linux-amd64.sha256

      # 以最终发布二进制为主体生成 SPDX JSON SBOM；output-file 让它同时进入 Release。
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          file: blog-linux-amd64
          format: spdx-json
          artifact-name: blog-linux-amd64.spdx.json
          output-file: blog-linux-amd64.spdx.json

      # 证明由本仓库的 GitHub Actions 构建的二进制，部署端可用 gh attestation verify 校验。
      - name: Attest Linux binary provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: blog-linux-amd64

      # 产物：Actions Artifacts（每次构建，保留 30 天）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-linux-amd64
          path: |
            blog-linux-amd64
            blog-linux-amd64.sha256
            blog-linux-amd64.spdx.json
          retention-days: 30

      # GitHub Release（打 tag 时，服务器 update.sh 从此下载）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            blog-linux-amd64
            blog-linux-amd64.sha256
            blog-linux-amd64.spdx.json
          generate_release_notes: true
          fail_on_unmatched_files: true  # 如果没有二进制文件则失败
