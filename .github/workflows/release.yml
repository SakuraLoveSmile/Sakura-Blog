name: Release Build

# release 分支推送 / 打 tag / 手动触发均可构建。
# 产物 1：Linux amd64 单二进制（go:embed 全部资源），服务器下载即可运行。
# 产物 2：Docker 镜像推送至 GHCR（私有包），配合 Watchtower 实现服务器自动更新。
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- Job 1：编译 Linux 二进制 + GitHub Release ----
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Console SPA（go:embed 编译期要求 console/dist 非空）----
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build console
        run: cd console && npm ci && npm run build

      # ---- Go 交叉编译（sqlite 纯 Go 实现，CGO 可关）----
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o blog-linux-amd64 ./cmd/server
          sha256sum blog-linux-amd64 > blog-linux-amd64.sha256

      # 产物：Actions Artifacts（每次构建，保留 30 天）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-linux-amd64
          path: |
            blog-linux-amd64
            blog-linux-amd64.sha256
          retention-days: 30

      # GitHub Release（打 tag 时，服务器可直链下载）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            blog-linux-amd64
            blog-linux-amd64.sha256
          generate_release_notes: true

  # ---- Job 2：构建 Docker 镜像并推送 GHCR（私有仓库自动继承私有包） ----
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
