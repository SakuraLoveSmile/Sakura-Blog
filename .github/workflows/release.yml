name: Release Build

# release 分支推送 / 打 tag / 手动触发均可构建。
# 产物：Linux amd64 单二进制（go:embed 全部资源）+ GitHub Release。
# 服务器通过 deploy/update.sh 定时检查 Release 并自动下载更新。
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release + 生成 release notes
    steps:
      - uses: actions/checkout@v4

      # ---- Console SPA（go:embed 编译期要求 frontend/console/dist 非空）----
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json

      - name: Build console
        run: cd frontend/console && npm ci && npm run build

      # ---- Go 交叉编译（sqlite 纯 Go 实现，CGO 可关）----
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o blog-linux-amd64 ./backend/cmd/server
          sha256sum blog-linux-amd64 > blog-linux-amd64.sha256

      # 产物：Actions Artifacts（每次构建，保留 30 天）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-linux-amd64
          path: |
            blog-linux-amd64
            blog-linux-amd64.sha256
          retention-days: 30

      # GitHub Release（打 tag 时，服务器 update.sh 从此下载）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            blog-linux-amd64
            blog-linux-amd64.sha256
          generate_release_notes: true
          fail_on_missing_files: true  # 如果没有二进制文件则失败
