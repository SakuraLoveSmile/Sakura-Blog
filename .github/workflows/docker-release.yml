name: Docker Release

# 打 tag 或手动触发构建并推送 GHCR 镜像。镜像把二进制打进镜像层，
# 与 deploy/update-docker.sh 的「挂载目录替换二进制」是两种独立部署形态，
# 二者任选其一（详见 deploy/README.md）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # GHCR 要求全小写仓库名
  IMAGE_NAME: ghcr.io/sakuralovesmile/sakura-blog

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 GHCR（同一 owner 命名空间，GITHUB_TOKEN 即可）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute build metadata
        id: meta
        run: |
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "frontend_hash=$(scripts/console-input-hash.sh 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: tags
        uses: docker/metadata-action@c1e51972afc2121e065aaf6de45b3c1770b9f3f3 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            FRONTEND_HASH=${{ steps.meta.outputs.frontend_hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
