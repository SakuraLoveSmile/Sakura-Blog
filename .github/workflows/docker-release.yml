name: Docker Release

# 打 tag 或手动触发构建并推送 GHCR 镜像。镜像把二进制打进镜像层，
# 与 deploy/update-docker.sh 的「挂载目录替换二进制」是两种独立部署形态，
# 二者任选其一（详见 deploy/README.md）。
# latest 只由 tag 推送更新：手动触发（无论在哪个 ref 上）不得改写生产 compose 使用的 :latest。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签（如 v1.7.2）；留空则只用 sha/分支标签'
        required: false

env:
  # GHCR 要求全小写仓库名
  IMAGE_NAME: ghcr.io/sakuralovesmile/sakura-blog

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 GHCR（同一 owner 命名空间，GITHUB_TOKEN 即可）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute build metadata
        id: meta
        run: |
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "frontend_hash=$(scripts/console-input-hash.sh 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          # workflow_dispatch 手动指定版本；tag 推送用 ref_name
          ver="${{ inputs.version }}"
          [ -n "$ver" ] || ver="${{ github.ref_name }}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest 仅随 tag 推送移动；workflow_dispatch 即使选中 tag ref 也不移动它。
      - name: Extract image tags
        id: tags
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.meta.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && steps.meta.outputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            FRONTEND_HASH=${{ steps.meta.outputs.frontend_hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
