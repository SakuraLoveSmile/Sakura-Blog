name: Docker Release

# 打 tag 或手动触发构建并推送 GHCR 镜像。镜像把二进制打进镜像层，
# 是本仓库唯一的发布产物；服务器通过 compose 拉取固定版本标签升级（详见 deploy/README.md）。
# tag 推送后额外创建一个不带资产的 GitHub Release（自动生成更新日志），供 Console「检查更新」展示。
# latest 只由正式版 tag 推送更新：手动触发（无论在哪个 ref 上）不得改写生产 compose 使用的 :latest。
# 预发布（版本串含 '-'，如 v2.0.7-beta01）只发布自身完整版本标签，不生成 X.Y / X 别名、
# 不移动 latest，GitHub Release 标记 prerelease，避免 beta 顶替正式版镜像标签。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签（如 v1.7.2）；留空则只用 sha/分支标签'
        required: false

env:
  # GHCR 要求全小写仓库名
  IMAGE_NAME: ghcr.io/sakuralovesmile/sakura-blog

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建仅含更新日志的 GitHub Release
      packages: write   # 推送 GHCR（同一 owner 命名空间，GITHUB_TOKEN 即可）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute build metadata
        id: meta
        run: |
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "frontend_hash=$(scripts/console-input-hash.sh 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          # workflow_dispatch 手动指定版本；tag 推送用 ref_name
          ver="${{ inputs.version }}"
          [ -n "$ver" ] || ver="${{ github.ref_name }}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # 预发布判定：版本串含 '-'（2.0.7-beta01、2.0.7-rc1 等）。
          # 该标记决定是否生成 X.Y / X 别名、是否移动 latest、是否把 Release 标为 prerelease。
          case "$ver" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest 仅随正式版 tag 推送移动；workflow_dispatch 即使选中 tag ref 也不移动它。
      # 预发布只保留完整版本标签与 sha 标签：不生成 X.Y / X 别名，避免 beta 覆盖稳定镜像标签。
      - name: Extract image tags
        id: tags
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.meta.outputs.prerelease != 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.meta.outputs.prerelease != 'true' }}
            type=raw,value=${{ steps.meta.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && steps.meta.outputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.meta.outputs.prerelease != 'true' }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            FRONTEND_HASH=${{ steps.meta.outputs.frontend_hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 仅补充更新日志的 Release：不附加任何二进制资产，镜像仍是唯一发布产物。
      # 已存在时跳过，避免重跑 tag 工作流失败；预发布版本标记 prerelease（不会成为 Latest）。
      - name: Create GitHub Release (notes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
