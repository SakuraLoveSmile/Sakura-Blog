# 镜像部署示例：二进制内置在镜像中，只挂载运行态子目录。
# 升级走 `docker compose pull && up -d`；生产必须固定具体 X.Y.Z 标签。
# Console「检查更新」读取 GHCR 镜像标签，只检测、不执行升级（详见 deploy/README.md）。
services:
  blog:
    image: ghcr.io/sakuralovesmile/sakura-blog:2.1.8   # 固定具体版本，升级与回退都只改这一行
    container_name: blog
    restart: unless-stopped
    ports:
      - "8081:8080"          # 宿主端口:容器端口，按需调整
    volumes:
      # 只挂运行态子目录；不要整目录挂到 /app（会遮住镜像内二进制）
      - /opt/blog/config:/app/config
      - /opt/blog/data:/app/data
      - /opt/blog/content:/app/content
    # environment:            # BLOG_* 环境变量覆盖 config/app.yml，按需启用
    #   BLOG_LISTEN: ":8080"
