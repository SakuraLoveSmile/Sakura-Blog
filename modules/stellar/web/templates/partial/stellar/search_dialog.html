<dialog data-stellar-runtime-region class="search-dialog" id="site-search-dialog" aria-labelledby="site-search-title">
<div class="search-dialog__panel search-wrapper" id="site-search-wrapper" searching="false">
<div class="search-dialog__header"><div class="search-form" role="search"><span class="search-button" aria-hidden="true">{{sf_icon "default:search"}}</span><input type="search" class="search-input" id="site-search-input" aria-labelledby="site-search-title" placeholder="{{sf_t .Stellar.Language "btn.search"}}"></div><button type="button" class="search-dialog__close" data-shell-action="close-search" aria-label="{{sf_t .Stellar.Language "search.close"}}">×</button></div>
{{if eq (sf_get .Stellar.Client "ClientData.ctx.search.service") "local_search"}}<div class="search-dialog__scope" role="radiogroup" aria-labelledby="site-search-title" hidden><label class="search-dialog__scope-option" data-search-scope-option="all"><input class="ui-radio" type="radio" name="site-search-scope" value="all"><span>{{sf_t .Stellar.Language "search.scope_all"}}</span></label><label class="search-dialog__scope-option" data-search-scope-option="blog" hidden><input class="ui-radio" type="radio" name="site-search-scope" value="blog"><span>{{sf_t .Stellar.Language "search.scope_blog"}}</span></label><label class="search-dialog__scope-option" data-search-scope-option="current" hidden><input class="ui-radio" type="radio" name="site-search-scope" value="current"><span data-search-scope-current-label></span></label></div>{{end}}
<h2 class="search-dialog__title" id="site-search-title">{{sf_t .Stellar.Language "search.search"}}</h2>{{template "partial/stellar/blog_ask" .}}<div class="search-result" id="site-search-result"></div><div class="search-no-result">{{sf_t .Stellar.Language "search.no_results"}}</div>
</div></dialog>
