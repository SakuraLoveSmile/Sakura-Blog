{{- /* 搜索浮层保留本地索引、Wiki 筛选与 AI 问答契约。 */ -}}
<dialog id="site-search-dialog" class="search-dialog ui-surface" aria-labelledby="search-dialog-title">
<div class="search-dialog__panel search-wrapper" id="search-wrapper" searching="false">
  <h2 class="search-dialog__title" id="search-dialog-title">{{lang "search.search"}}</h2>
  <div class="search-dialog__header">
  <div class="search-form" role="search">
    <label class="search-button" for="search-input" aria-hidden="true">
      {{icon "default:search"}}
    </label>
    <input type="search" class="search-input" id="search-input" aria-label="{{if .SearchPlaceholder}}{{.SearchPlaceholder}}{{else}}{{lang "search.search"}}{{end}}" placeholder="{{if .SearchPlaceholder}}{{.SearchPlaceholder}}{{else}}{{lang "search.search"}}{{end}}"{{if .SearchFilter}} data-filter="{{.SearchFilter}}"{{end}}>
  </div>
    <button type="button" class="search-dialog__close ui-interactive" data-search-action="close" aria-label="关闭搜索">×</button>
  </div>
  {{if .QAEnabled}}
  <section class="search-ai-ask" id="rag-ai-ask" aria-label="AI 问答">
    <button type="button" class="search-ai-ask-button" data-rag-ai-open>
      {{icon "default:search"}}<span>问问 AI</span>
    </button>
    <form class="search-ai-ask-form" data-rag-ai-form hidden>
      <textarea class="search-ai-ask-input" data-rag-ai-input rows="3" maxlength="1000" placeholder="询问站内公开内容"></textarea>
      <div class="search-ai-ask-actions">
        {{if .QAAllowUserLLM}}<button type="button" class="search-ai-ask-byok" data-rag-ai-byok>使用自己的 AI 模型</button>{{end}}
        <button type="submit" class="search-ai-ask-submit">发送</button>
      </div>
      <div class="search-ai-ask-byok-form" data-rag-ai-byok-form hidden>
        <input type="url" class="search-ai-ask-input" data-rag-ai-endpoint placeholder="模型接口地址（https://...）">
        <input type="text" class="search-ai-ask-input" data-rag-ai-model placeholder="模型名称">
        <input type="password" class="search-ai-ask-input" data-rag-ai-key placeholder="API Key（仅本次发送）">
      </div>
    </form>
    <div class="search-ai-ask-result" data-rag-ai-result hidden></div>
  </section>
  {{end}}
  <div class="search-result" id="search-result"></div>
  <div class="search-no-result">{{- lang "search.no_result" -}}</div>
</div>

</dialog>
