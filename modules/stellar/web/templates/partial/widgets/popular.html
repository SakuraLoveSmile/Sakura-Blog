{{- /* widgets/popular.html: 热门文章（本项目自创，注册进 library 保留），按阅读量降序，结构对齐 widgets/recent.ejs（post-list）。
   上下文为 WidgetInstance（Spec 33）：.Data 为按 limit 截断的列表。*/ -}}
{{if .Data}}
<widget class="widget-wrapper popular post-list">
  <div class="widget-header dis-select">
    <span class="name">{{.Str "title" (lang "widget.popular")}}</span>
  </div>
  <div class="widget-body fs14">
    {{range .Data}}
    <a class="item title" href="{{url_for .URL}}"><span class="title">{{.Title}}</span></a>
    {{end}}
  </div>
</widget>
{{end}}
