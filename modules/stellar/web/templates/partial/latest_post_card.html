{{- /* latest_post_card.html: 专栏最新文章公共封面卡片。 */ -}}
{{- $background := .Cover -}}
{{- if .LatestPost -}}
{{- if .LatestPost.Cover}}{{$background = .LatestPost.Cover}}{{end -}}
<a class="cover card-hover card-hover--spotlight card-hover--tilt" position="bottom" style="--cover-url:url('{{$background}}')" href="/post/{{.LatestPost.Slug}}">
  <img src="{{$background}}" alt="{{.LatestPost.Title}}" loading="lazy">
  <div class="cover-info" position="bottom" data-text-adaptive="split">
    <div class="text headline">{{.LatestPost.Title}}</div>
    <div class="text caption">{{date .LatestPost.Date "2006年1月2日"}}</div>
  </div>
</a>
{{- else if $background -}}
<a class="cover card-hover card-hover--spotlight card-hover--tilt" position="bottom" style="--cover-url:url('{{$background}}')" href="/topic/{{.Slug}}">
  <img src="{{$background}}" alt="{{.Name}}" loading="lazy">
  <div class="cover-info" position="bottom" data-text-adaptive="split"><div class="text headline">{{.Name}}</div></div>
</a>
{{- end -}}
