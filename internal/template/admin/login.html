{{- /* admin/login.html: 管理后台登录页（无侧栏，统一 admin 变量） */ -}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "admin/head" .}}
<body class="admin-body">
  <div class="sitebg"><div class="siteblur"></div></div>
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <h1>{{.Site.Title}}</h1>
      <p class="sub">管理后台登录</p>
      {{if .Admin.LoginError}}<p class="admin-msg-error">{{.Admin.LoginError}}</p>{{end}}
      <form method="post" action="/admin/login">
        <input type="hidden" name="from" value="{{.Admin.LoginFrom}}">
        <div class="admin-form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" autofocus required>
        </div>
        <button type="submit" class="btn-login">登 录</button>
      </form>
      <a class="back-home" href="/">← 返回首页</a>
    </div>
  </div>
</body>
</html>
