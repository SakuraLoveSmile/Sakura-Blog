{{- /* admin/edit.html: 新建/编辑文章 + EasyMDE Markdown 编辑器 */ -}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "admin/head" .}}
<body class="admin-body">
  <div class="sitebg"><div class="siteblur"></div></div>
  <div class="admin-shell" id="admin-shell">
    <div class="admin-overlay" id="admin-overlay"></div>
    {{template "admin/sidebar" .}}
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <button type="button" class="admin-menu-toggle" id="admin-menu-toggle" aria-label="打开菜单">
            <iconify-icon icon="solar:hamburger-menu-linear"></iconify-icon>
          </button>
          <h1>{{if .Admin.IsEdit}}编辑文章{{else}}新建文章{{end}}</h1>
        </div>
        <div class="admin-topbar-actions">
          <a href="/admin/posts" class="admin-btn admin-btn-secondary">返回列表</a>
        </div>
      </header>
      <div class="admin-content">
        {{if .Admin.SaveError}}<p class="admin-msg-error">{{.Admin.SaveError}}</p>{{end}}

        <form method="post" action="/admin/save" id="post-form">
          {{if .Admin.IsEdit}}<input type="hidden" name="orig_slug" value="{{.Admin.EditPost.Slug}}">{{end}}

          <div class="admin-form-row">
            <div class="admin-form-group" style="flex:2">
              <label for="title">标题</label>
              <input type="text" id="title" name="title" value="{{.Admin.EditPost.Title}}" placeholder="文章标题">
            </div>
            <div class="admin-form-group" style="flex:1">
              <label for="slug">Slug</label>
              <input type="text" id="slug" name="slug" value="{{.Admin.EditPost.Slug}}" placeholder="url-friendly-slug">
            </div>
          </div>

          <div class="admin-form-group">
            <label for="excerpt">摘要</label>
            <input type="text" id="excerpt" name="excerpt" value="{{.Admin.EditPost.Excerpt}}" placeholder="一句话摘要（可选）">
          </div>

          <div class="admin-form-group">
            <label for="cover">封面图 URL</label>
            <input type="text" id="cover" name="cover" value="{{.Admin.EditPost.Cover}}" placeholder="https://...（可选，首页卡片封面）">
          </div>

          <div class="admin-form-row">
            <div class="admin-form-group" style="flex:1">
              <label for="category">分类</label>
              <input type="text" id="category" name="category" value="{{.Admin.EditPost.Category}}" placeholder="单分类（可选）">
            </div>
            <div class="admin-form-group" style="flex:2">
              <label for="tags">标签</label>
              <input type="text" id="tags" name="tags" value="{{.Admin.EditPost.Tags}}" placeholder="多个标签用英文逗号分隔，如 Go,Gin（可选）">
            </div>
          </div>

          <div class="admin-form-group">
            <label for="content">正文（Markdown）</label>
            <textarea id="content" name="content" rows="20">{{.Admin.EditPost.ContentMD}}</textarea>
          </div>

          <div class="admin-form-row">
            <div class="admin-form-group" style="flex:1">
              <label for="status">状态</label>
              <select id="status" name="status">
                <option value="draft"{{if eq .Admin.EditPost.Status "draft"}} selected{{end}}>draft（草稿）</option>
                <option value="published"{{if eq .Admin.EditPost.Status "published"}} selected{{end}}>published（已发布）</option>
              </select>
            </div>
          </div>

          <div class="admin-form-actions">
            <button type="submit" class="admin-btn admin-btn-primary">保存</button>
            <a href="/admin/posts" class="admin-btn admin-btn-secondary">取消</a>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script>
    (function () {
      var shell = document.getElementById('admin-shell');
      var toggle = document.getElementById('admin-menu-toggle');
      var overlay = document.getElementById('admin-overlay');
      if (shell && toggle) {
        function closeSidebar() { shell.classList.remove('is-sidebar-open'); }
        toggle.addEventListener('click', function () { shell.classList.toggle('is-sidebar-open'); });
        if (overlay) overlay.addEventListener('click', closeSidebar);
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.js"></script>
  <script>
    new EasyMDE({
      element: document.getElementById('content'),
      spellChecker: false,
      autofocus: false,
      status: false,
      forceSync: true,
      renderingConfig: { codeSyntaxHighlighting: false },
      toolbar: ['bold', 'italic', 'strikethrough', '|', 'heading', 'quote', 'unordered-list', 'ordered-list', '|', 'link', 'image', 'code', 'table', '|', 'preview', 'side-by-side', 'fullscreen', '|', 'guide'],
      sideBySideFullscreen: false
    });
  </script>
</body>
</html>
