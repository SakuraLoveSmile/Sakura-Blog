{{define "admin/sidebar"}}
<aside class="admin-side" id="admin-sidebar">
  <div class="admin-side-head">
    <a class="admin-logo" href="/admin/dashboard">
      <iconify-icon icon="solar:widget-5-bold-duotone"></iconify-icon>
      <span>{{.Site.Title}}</span>
    </a>
    <div class="admin-search">
      <iconify-icon icon="solar:magnifer-linear"></iconify-icon>
      <input type="search" placeholder="搜索…" aria-label="搜索">
    </div>
  </div>
  <nav class="admin-nav">
    <a href="/admin/dashboard" class="{{if eq .Page.MenuID "dashboard"}}active{{end}}">
      <iconify-icon icon="solar:widget-5-bold-duotone"></iconify-icon>
      <span>仪表盘</span>
    </a>
    <a href="/admin/posts" class="{{if eq .Page.MenuID "posts"}}active{{end}}">
      <iconify-icon icon="solar:document-text-bold-duotone"></iconify-icon>
      <span>文章</span>
    </a>
    <a href="/admin/comments" class="{{if eq .Page.MenuID "comments"}}active{{end}}">
      <iconify-icon icon="solar:chat-round-line-bold-duotone"></iconify-icon>
      <span>评论</span>
    </a>
    <a href="/admin/media" class="{{if eq .Page.MenuID "media"}}active{{end}}">
      <iconify-icon icon="solar:gallery-bold-duotone"></iconify-icon>
      <span>附件</span>
    </a>
    <a href="/admin/pages" class="{{if eq .Page.MenuID "pages"}}active{{end}}">
      <iconify-icon icon="solar:file-text-bold-duotone"></iconify-icon>
      <span>页面</span>
    </a>
    <div class="admin-nav-divider"></div>
    <a href="/" target="_blank" rel="noopener">
      <iconify-icon icon="solar:home-2-bold-duotone"></iconify-icon>
      <span>查看前台</span>
    </a>
    <form method="post" action="/admin/logout">
      <button type="submit">
        <iconify-icon icon="solar:logout-2-bold-duotone"></iconify-icon>
        <span>退出</span>
      </button>
    </form>
  </nav>
</aside>
{{end}}
