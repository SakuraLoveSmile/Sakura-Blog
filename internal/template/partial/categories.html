{{- /* categories.html: 分类索引页，对齐 Stellar layout/categories.ejs
   navbar + div.post-list > article#cats > a.cat（名称 + 文章数 badge）
   由 base.html 按 .Page.Layout == "categories" 分派渲染。
*/ -}}
{{template "navbar" .}}
<div class="post-list">
  <article id="cats">
    {{range .Cats}}
    <div>
      <a class="cat" href="/categories/{{.Name}}">
        <span class="name">{{icon "default:category"}}{{.Name}}</span>
        <span class="badge">({{.Count}})</span>
      </a>
    </div>
    {{end}}
  </article>
</div>
