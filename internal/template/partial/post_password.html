{{- /* 密码保护文章：未通过口令时的占位表单 */ -}}
<div class="article banner top">
  <div class="content">
    <div class="bottom only-title">
      <div class="text-area">
        <h1 class="text title"><span>{{.Page.Title}}</span></h1>
      </div>
    </div>
  </div>
</div>
<article class="md-text content">
  <div class="tag-plugin colorful note" color="yellow">
    <div class="title">需要口令</div>
    <div class="body">本文已加密，请输入阅读密码后继续。</div>
  </div>
  {{if .Page.Excerpt}}
  <p style="color:var(--text-p2)">{{.Page.Excerpt}}</p>
  {{end}}
  <form id="post-password-form" method="post" action="/post/{{.Page.Slug}}/unlock" style="margin-top:1.5rem;max-width:360px">
    <div style="margin-bottom:1rem;display:flex;flex-direction:column;gap:4px">
      <label for="post-password">阅读密码</label>
      <input type="password" id="post-password" name="password" required autofocus style="width:100%;padding:.5rem .75rem;border:1px solid var(--block-border);border-radius:8px;background:var(--card);color:var(--text)" />
    </div>
    {{if .Page.Description}}
    <p style="color:var(--text-error);font-size:.875rem">{{.Page.Description}}</p>
    {{end}}
    <p id="post-password-error" style="color:var(--text-error);font-size:.875rem;display:none"></p>
    <button type="submit" id="post-password-btn" class="tag-plugin colorful button" color="cyan"><span>解锁阅读</span></button>
  </form>
</article>
<script>
// Spec Task 8: 密码解锁交互增强--fetch 提交不刷新页面，错误提示友好，防重复提交
(function () {
  var form = document.getElementById('post-password-form');
  if (!form) return;
  var btn = document.getElementById('post-password-btn');
  var btnText = btn.querySelector('span');
  var errEl = document.getElementById('post-password-error');
  var input = document.getElementById('post-password');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (btn.disabled) return;
    btn.disabled = true;
    btnText.textContent = '解锁中...';
    errEl.style.display = 'none';

    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      redirect: 'manual' // 不跟随重定向：密码正确时后端返回 302
    }).then(function (res) {
      // opaqueredirect = 后端 302 重定向 = 密码正确；basic 200 = 密码错误（返回 HTML）
      if (res.type === 'opaqueredirect') {
        location.reload(); // cookie 已设置，刷新显示文章正文
      } else {
        errEl.textContent = '密码错误，请重试';
        errEl.style.display = 'block';
        input.value = '';
        input.focus();
        btn.disabled = false;
        btnText.textContent = '解锁阅读';
      }
    }).catch(function () {
      errEl.textContent = '网络错误，请检查连接后重试';
      errEl.style.display = 'block';
      btn.disabled = false;
      btnText.textContent = '解锁阅读';
    });
  });
})();
</script>
