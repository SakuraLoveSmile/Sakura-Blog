{{- /* 密码保护文章：未通过口令时的占位表单 */ -}}
<div class="article banner top">
  <div class="content">
    <div class="bottom only-title">
      <div class="text-area">
        <h1 class="text title"><span>{{.Page.Title}}</span></h1>
      </div>
    </div>
  </div>
</div>
<article class="md-text content">
  <div class="tag-plugin colorful note password-note" color="yellow">
    <div class="title">{{- lang "password.title" -}}</div>
    <div class="body">{{- lang "password.body" -}}</div>
  </div>
  {{if .Page.Excerpt}}
  <p style="color:var(--text-p2)">{{.Page.Excerpt}}</p>
  {{end}}
  <form id="post-password-form" method="post" action="/post/{{.Page.Slug}}/unlock">
    <div class="post-password-field">
      <label class="post-password-label" for="post-password">{{- lang "password.label" -}}</label>
      <input type="password" id="post-password" class="post-password-input" name="password" required autofocus />
    </div>
    {{if .Page.Description}}
    <p class="post-password-desc">{{.Page.Description}}</p>
    {{end}}
    <p id="post-password-error" class="post-password-error" style="display:none"></p>
    <button type="submit" id="post-password-btn"><span>{{- lang "password.submit" -}}</span></button>
  </form>
</article>
<script>
// Spec Task 8: 密码解锁交互增强--fetch 提交不刷新页面，错误提示友好，防重复提交
(function () {
  var form = document.getElementById('post-password-form');
  if (!form) return;
  var btn = document.getElementById('post-password-btn');
  var btnText = btn.querySelector('span');
  var errEl = document.getElementById('post-password-error');
  var input = document.getElementById('post-password');
  var _langUnlocking = '{{lang "password.unlocking"}}';
  var _langSubmit = '{{lang "password.submit"}}';
  var _langError = '{{lang "password.error"}}';
  var _langNetError = '{{lang "password.net_error"}}';

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (btn.disabled) return;
    btn.disabled = true;
    btnText.textContent = _langUnlocking;
    errEl.style.display = 'none';

    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      redirect: 'manual' // 不跟随重定向：密码正确时后端返回 302
    }).then(function (res) {
      // opaqueredirect = 后端 302 重定向 = 密码正确；basic 200 = 密码错误（返回 HTML）
      if (res.type === 'opaqueredirect') {
        location.reload(); // cookie 已设置，刷新显示文章正文
      } else {
        errEl.textContent = _langError;
        errEl.style.display = 'block';
        input.value = '';
        input.focus();
        btn.disabled = false;
        btnText.textContent = _langSubmit;
      }
    }).catch(function () {
      errEl.textContent = _langNetError;
      errEl.style.display = 'block';
      btn.disabled = false;
      btnText.textContent = _langSubmit;
    });
  });
})();
</script>
