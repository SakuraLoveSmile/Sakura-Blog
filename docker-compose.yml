# docker-compose：博客 app 服务 + Watchtower 自动更新 + 持久化卷。
# 评论系统为自建（数据存 SQLite，无需外部评论服务）；后台登录密码在 config/site.yml
# 的 admin.password 配置（留空则 /admin 免登录，仅本机调试用，公网部署务必设置）。
#
# 启动：docker compose up -d
# 首次启动导入文章：BLOG_SEED=true docker compose up -d（导一次后改回 false 重启）
# 升级：自动（Watchtower 轮询 GHCR 新镜像）或手动 docker compose pull && docker compose up -d
#
# ⚠️ 容器以非 root 用户 app（uid 10001）运行。若启动报 "unable to open database file"，
# 说明 ./blog-data 属主是 root（Docker 自动创建或手动迁移数据后），执行一次：
#   chown -R 10001:10001 ./blog-data
#
# ⚠️ 自动更新需要 GHCR 认证（私有仓库）：
#   服务器上执行一次 docker login ghcr.io（用 PAT，权限 read:packages），
#   Watchtower 会自动读取 ~/.docker/config.json 中的凭据。

services:
  blog:
    image: ghcr.io/sakuralovesmile/sakura-blog:latest
    container_name: stellar-blog
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # SQLite 数据持久化（DB + WAL 旁路文件；文章与评论均存于此）。
      # bind mount 到宿主机 ./blog-data，备份/迁移直接操作该目录。
      - ./blog-data:/app/data
      # 站点配置可运行时覆盖（不改镜像）
      - ./config/site.yml:/app/config/site.yml:ro
      # 文章种子（content/posts/*.md），改后 BLOG_SEED=true 重导
      - ./content:/app/content:ro
    environment:
      BLOG_LISTEN: ":8080"
      BLOG_DB: "/app/data/blog.db"
      BLOG_ROOT: "/app"
      BLOG_SEED: "false"
      # 自动备份（每 24h 全量备份到 /app/data/backups/，留存最近 N 份）
      BLOG_AUTO_BACKUP: "true"
      BLOG_BACKUP_KEEP: "7"
      # 反向代理（nginx 同机）：BLOG_TRUSTED_PROXY=127.0.0.1/32
      # 时区
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Watchtower：轮询 GHCR 镜像更新，发现新版自动拉取并重建 blog 容器。
  # 仅监控带 com.centurylinklabs.watchtower.enable=true 标签的容器。
  watchtower:
    image: containrrr/watchtower
    container_name: stellar-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 读取宿主机 docker login 凭据（私有 GHCR 拉取需要）
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"          # 每 5 分钟检查一次
      WATCHTOWER_LABEL_ENABLE: "true"          # 仅更新带标签的容器
      WATCHTOWER_CLEANUP: "true"               # 更新后删除旧镜像
      WATCHTOWER_INCLUDE_STOPPED: "false"
      TZ: Asia/Shanghai
