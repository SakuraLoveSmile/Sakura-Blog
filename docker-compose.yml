# docker-compose：博客 app 服务 + 持久化卷（本地构建模式，备选）。
# 生产环境推荐使用 deploy/ 目录下的 systemd + update.sh 二进制部署方案。
#
# 启动：docker compose up -d
# 升级：docker compose build && docker compose up -d

services:
  blog:
    build: .
    image: stellar-blog:latest
    container_name: stellar-blog
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./blog-data:/app/data
      - ./config/site.yml:/app/config/site.yml:ro
      - ./content:/app/content:ro
    environment:
      BLOG_LISTEN: ":8080"
      BLOG_DB: "/app/data/blog.db"
      BLOG_ROOT: "/app"
      BLOG_SEED: "false"
      BLOG_AUTO_BACKUP: "true"
      BLOG_BACKUP_KEEP: "7"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
