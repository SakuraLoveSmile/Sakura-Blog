# docker-compose：博客 app 服务 + 持久化卷。
# Artalk 评论系统按用户决策外置部署（官方单二进制，不纳入本 compose），
# 部署方式见 config/site.yml 的 comments 段注释或 https://artalk.docs.errorly.dev/。
#
# 启动：docker compose up -d
# 首次启动导入文章：BLOG_SEED=true docker compose up -d（导一次后改回 false 重启）
# 升级：docker compose build && docker compose up -d

services:
  blog:
    build: .
    image: stellar-blog:latest
    container_name: stellar-blog
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # SQLite 数据持久化（DB + WAL 旁路文件）
      - blog-data:/app/data
      # 站点配置可运行时覆盖（不改镜像）
      - ./config/site.yml:/app/config/site.yml:ro
      # 文章种子（content/posts/*.md），改后 BLOG_SEED=true 重导
      - ./content:/app/content:ro
    environment:
      BLOG_LISTEN: ":8080"
      BLOG_DB: "/app/data/blog.db"
      BLOG_ROOT: "/app"
      BLOG_SEED: "false"
      # 反向代理（nginx 同机）：BLOG_TRUSTED_PROXY=127.0.0.1/32
      # 时区
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  blog-data:
