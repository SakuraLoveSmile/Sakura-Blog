# 站点配置，对应 internal/config/site.go 的 DefaultSite()。
# 启动时由 config.LoadSite 加载；文件缺失/解析失败时 fallback 到 DefaultSite()。
# 注意：# 开头的值（如主题色）必须加引号；raw HTML（如 social icon）用单引号包裹。

title: Stellar Demo
subtitle: Go 服务端渲染
description: 用 Go (Gin) + html/template + goldmark 重建 Stellar 风格博客，验证服务端渲染链路。
url: ""
avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
# 头像 hover 旋转背景图，对应原版 style.animated_avatar.background（animate: auto）
avatar_bg: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/rainbow64@3x.webp
logo_title: Stellar Demo
# 含 | 时拆 normal/hover 两段，鼠标 hover 标题时向上滚动切换（原版 logo.ejs 机制）
logo_sub: Go SSR 验证|Stellar 主题

menubar:
  columns: 2
  items:
    - id: post
      title: 博客
      url: /
      icon: solar:documents-bold-duotone
      theme: "#1BCDFC"
    - id: wiki
      title: 文库
      url: /wiki
      icon: solar:notebook-bookmark-bold-duotone
      theme: "#3DC550"
    - id: notes
      title: 笔记
      url: /notes
      icon: default:edit
      theme: "#FA7D23"
    - id: friends
      title: 友链
      url: /friends
      icon: solar:planet-bold-duotone
      theme: "#FF6B9D"

# 右栏（site.yml rightbar 段）
rightbar:
  # 欢迎语卡片内的链接列表（对齐原版 markdown widget 的 linklist）。columns 留空=按链接数
  welcome_linklist:
    items:
      - title: 查看文库
        url: /wiki
        icon: solar:notebook-bookmark-bold-duotone
      - title: 传送到笔记
        url: /notes
        icon: default:edit

# 文库项目（配置驱动，不入库）。每个项目一张卡片，点击跳到 url（站内文章/页面或外链）。
wiki:
  - id: stellar
    title: Stellar 主题文档
    description: Hexo Stellar 主题的使用文档与配置说明。
    icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
    tags: [主题, 前端]
    url: https://xaoxuu.com/wiki/stellar/
    sort: 100
  - id: go-blog
    title: Go 博客重构笔记
    description: 用 Go(Gin)+html/template+goldmark 复刻 Stellar 的实现记录。
    icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg
    tags: [后端, Go]
    url: /archives/
    sort: 90
  - id: frontend
    title: 前端拾遗
    description: CSS 变量、PJAX、懒加载等前端细节整理。
    icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
    tags: [前端]
    url: /categories/
    sort: 80

# 友链动态聚合（/friends 页）。refresh_interval：后端抓取友链 RSS 的刷新间隔（分钟），缺省 60。
friends:
  refresh_interval: 60

# 友情链接（配置驱动，不入库）。头像缺省时模板用主题默认占位图。
# rss 非空时，/friends 页后端会定时抓取该友链 RSS/Atom 最新文章并聚合展示；label/color 为分类标签与配色（16 进制不带 #）。
links:
  - title: 我的朋友
    items:
      - name: xaoxuu
        url: "https://xaoxuu.com/"
        avatar: "https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg"
        desc: Stellar 主题作者
        rss: "https://xaoxuu.com/atom.xml"
        label: 主题
        color: FF6B9D
      - name: Hexo
        url: "https://hexo.io/"
        avatar: "https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg"
        desc: 快速、简洁且高效的博客框架
        rss: "https://hexo.io/atom.xml"
        label: 框架
        color: 1BCDFC
  - title: 推荐站点
    items:
      - name: Go
        url: "https://go.dev/"
        avatar: "https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg"
        desc: The Go Programming Language
        rss: "https://go.dev/blog/feed.atom"
        label: 语言
        color: 3DC550

footer:
  social:
    - title: GitHub
      url: https://github.com/
      icon: '<img src="https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/social/08a41b181ce68.svg">'
    - title: Music
      url: '#'
      icon: '<img src="https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/social/3845874.svg">'
    - title: Unsplash
      url: '#'
      icon: '<img src="https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/social/3616429.svg">'
    - title: Comments
      url: '#'
      icon: '<img src="https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/social/942ebbf1a4b91.svg">'
  # 页脚站点地图（对齐原版 theme.footer.sitemap）：分组渲染为多列，栏数规则 6→3 / 7-8→4 / 其余 min(组数,5)
  sitemap:
    - title: 博客
      items:
        - title: 近期发布
          url: /
        - title: 分类
          url: /categories/
        - title: 标签
          url: /tags/
        - title: 归档
          url: /archives/
    - title: 页面
      items:
        - title: 文库
          url: /wiki
        - title: 笔记
          url: /notes
        - title: 友链
          url: /friends
        - title: 瞬间
          url: /moments
    - title: 订阅
      items:
        - title: RSS
          url: /rss.xml
        - title: Atom
          url: /atom.xml
        - title: JSON Feed
          url: /feed.json
    - title: 关于
      items:
        - title: Stellar 主题
          url: https://github.com/xaoxuu/hexo-theme-stellar
        - title: 管理后台
          url: /admin

# 文章页脚（版权声明 / 分享 / 打赏）
article:
  # 分类配色表（对齐原版 theme.article.category_color）：首页卡片分类 meta 的文字与底色
  category_color:
    技术: '#1BCDFC'
    测试: '#FA7D23'
  copyright:
    enabled: true
    license: 署名-非商业性使用-相同方式共享 4.0 国际
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  share:
    enabled: true
    platforms: [wechat, weibo, email, link]
  reward:
    enabled: false
    text: 打赏
    wechat: ''
    alipay: ''

# 管理后台
admin:
  password: ''            # /admin 访问密码；留空则不做密码 gate（本地开发用）。生产环境务必设置

# 评论系统（自建，参考 Artalk 架构 + Halo 设计语言）
comments:
  enabled: true           # 总开关：false 时文章页不渲染评论区、/api/comments 关闭
  title: 评论             # 评论区标题
  moderation: false       # true=先审后发（新评论 pending，管理页通过后公开）；false=直接发布
  admin_email: ''         # 博主邮箱：新评论通知收件人 + 博主身份匹配（该邮箱评论带博主徽章）
  admin_badge: 博主       # 博主徽章文案
  gravatar_mirror: https://weavatar.com/avatar  # Gravatar 镜像基址（头像 = {mirror}/{md5(email)}）
  # 邮件通知（net/smtp）。smtp_host 留空则通知整体关闭；发送失败仅记日志，不影响评论提交
  notify:
    smtp_host: ''
    smtp_port: 465
    username: ''
    password: ''
    from: ''              # 发件人地址，留空用 username
