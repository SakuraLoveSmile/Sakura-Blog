# 文章页脚（版权声明 / 分享 / 打赏）
article:
  # 置顶文章样式：carousel=顶部轮播，flat=平铺到列表顶部
  pin_style: carousel
  # 文章列表卡片布局（Spec 50）：tech=紧凑（缺省，零配置现状）/ story=图文大间距（自动加载 story.css）
  type: tech
  # 文章页是否显示字数与预计阅读时长
  reading_time: false
  # 文章卡片是否显示标签（最多 5 个）
  card_tags: false
  # 文章末尾是否显示本文标签（1.41 新增，位于 article-footer 之前；未配置视为开启）
  tags: true
  # AI 成分标签（1.41）：frontmatter 用 ai_label: manual/reviewed/polished/generated 标记，
  # 未写 frontmatter 且 default 为空时零渲染；文案由语言包提供，此处配置各档颜色与图标
  ai_label:
    default:
    manual:
      color: '#03a9f4'
      icon: default:shield-user
    reviewed:
      color: '#4caf50'
      icon: default:shield-check
    polished:
      color: '#4caf50'
      icon: default:shield-up
    generated:
      color: '#ff9800'
      icon: default:shield-warning
  # 分类配色表（对齐原版 theme.article.category_color）：首页卡片分类 meta 的文字与底色
  category_color:
    技术: '#1BCDFC'
    测试: '#FA7D23'
  # 分类图标表：分类名 → icon key（icons.yml 的 key 或图片 URL），未配置回退默认分类图标
  category_icon:
    技术: 'default:documents'
  # 标签图标表：标签名 → icon key（icons.yml 的 key 或图片 URL），未配置不渲染图标
  tag_icon:
    Go: 'quot:hashtag'
  copyright:
    enabled: true
    license: 署名-非商业性使用-相同方式共享 4.0 国际
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  share:
    enabled: true
    platforms: [wechat, weibo, email, link]
  reward:
    enabled: false
    text: 打赏
    wechat: ''
    alipay: ''
  # 下一篇导航（read_next）：同分类邻篇优先，无同分类邻篇回退全局时间序；false 关闭
  read_next: true
  # 相关文章数上限（共同标签数 desc + 时间 desc）；0 关闭
  related_posts: 5
  # 过期提醒阈值（天）：距最后更新超过该天数时文首显示提醒；0 用缺省 180
  expire_days: 180
  # 文首横幅（front matter banner:）宽高比；0 用主题默认 2.5
  banner_ratio: 2.5
  # 「编辑本文」路径映射：源路径前缀 → 仓库 blob URL 前缀（对齐原版 contributors.ejs map）。
  # 配置后文章页脚出现贡献者列表与编辑按钮；缺省注释关闭。
  # edit_this_page:
  #   posts/: https://github.com/your-name/your-repo/blob/main/content/posts/

# 本地搜索配置（对齐 Stellar search.local_search）。
# 首次聚焦再加载可减少首页初始请求；cache_ttl=0 表示不缓存搜索索引。
search:
  service: local_search
  local_search:
    field: all
    path: /search.json
    content: true
    lazy_load: true
    cache_ttl: 86400
    skip_search: []

# 管理后台
admin:
  password: ''            # 【密钥】/admin 访问密码；留空则不做密码 gate（本地开发用）。生产环境务必设置

# 侧边栏组件配置化编排（Spec 33，形状对照原版 _data/widgets.yml + site_tree）。
# 不写本段 = 内置缺省布局（与未配置化前渲染结果一致）：
#   leftbar:  related, recent, tagcloud, popular（搜索框固定首位，不参与编排）
#   rightbar: welcome, author, siteinfo, latest_comment, toc
# library：组件库（组件名 → layout + 参数），同名组件浅合并覆盖内置缺省参数；
# pages：页面类型 → 左右栏组件序列，类型枚举 index/post/page/archive/categories/tags/topic/wiki/friends/notes/moments，
