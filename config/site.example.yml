# 文章页脚（版权声明 / 分享 / 打赏）
article:
  # 分类配色表（对齐原版 theme.article.category_color）：首页卡片分类 meta 的文字与底色
  category_color:
    技术: '#1BCDFC'
    测试: '#FA7D23'
  copyright:
    enabled: true
    license: 署名-非商业性使用-相同方式共享 4.0 国际
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  share:
    enabled: true
    platforms: [wechat, weibo, email, link]
  reward:
    enabled: false
    text: 打赏
    wechat: ''
    alipay: ''
  # 下一篇导航（read_next）：同分类邻篇优先，无同分类邻篇回退全局时间序；false 关闭
  read_next: true
  # 相关文章数上限（共同标签数 desc + 时间 desc）；0 关闭
  related_posts: 5
  # 过期提醒阈值（天）：距最后更新超过该天数时文首显示提醒；0 用缺省 180
  expire_days: 180
  # 文首横幅（front matter banner:）宽高比；0 用主题默认 2.5
  banner_ratio: 2.5
  # 「编辑本文」路径映射：源路径前缀 → 仓库 blob URL 前缀（对齐原版 contributors.ejs map）。
  # 配置后文章页脚出现贡献者列表与编辑按钮；缺省注释关闭。
  # edit_this_page:
  #   posts/: https://github.com/your-name/your-repo/blob/main/content/posts/

# 管理后台
admin:
  password: ''            # 【密钥】/admin 访问密码；留空则不做密码 gate（本地开发用）。生产环境务必设置

# 侧边栏组件配置化编排（Spec 33，形状对照原版 _data/widgets.yml + site_tree）。
# 不写本段 = 内置缺省布局（与未配置化前渲染结果一致）：
#   leftbar:  related, recent, tagcloud, popular（搜索框固定首位，不参与编排）
#   rightbar: welcome, author, siteinfo, latest_comment, toc
# library：组件库（组件名 → layout + 参数），同名组件浅合并覆盖内置缺省参数；
# pages：页面类型 → 左右栏组件序列，类型枚举 index/post/page/archive/categories/tags/topic/wiki/friends/notes/moments，
# 未配置的类型回退 index 布局。可用 layout：recent/tagcloud/popular/related/markdown/author/siteinfo/latest_comment/toc/ghrepo/ghuser/ghissues/timeline。
# widgets:
#   library:
#     recent: {layout: recent, limit: 10}                 # 最近更新（rss: '' 可隐藏订阅按钮）
#     toc: {layout: toc, list_number: false, min_depth: 1, max_depth: 6, collapse: 'false'}
#     tagcloud: {layout: tagcloud, amount: 20, orderby: count, order: -1, show_count: false, color: false, start_color: '#999', end_color: '#1BCDFC'}
#     intro: {layout: markdown, title: 公告, content: 任意文本}  # 通用 markdown 组件
#     ghrepo: {layout: ghrepo, repo: xaoxuu/hexo-theme-stellar} # GitHub 仓库卡（走本地 /api/gh 代理）
#     ghuser: {layout: ghuser, username: xaoxuu, avatar: true}  # GitHub 用户卡
#     ghissues: {layout: ghissues, repo: xaoxuu/hexo-theme-stellar, title: Recent Issues, limit: 3, labels: ''}
#     timeline: {layout: timeline, title: 近期动态, api: 'https://api.github.com/repos/xaoxuu/hexo-theme-stellar/issues', user: '', limit: 10}
#   pages:
#     post: {leftbar: [related, recent], rightbar: [ghrepo, toc]}
#     index: {leftbar: [recent, tagcloud], rightbar: [welcome, author, siteinfo, latest_comment]}

