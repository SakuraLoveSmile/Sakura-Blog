# SEO 设置（Spec 42）：站点级默认 meta 与收录控制；文章级可在编辑器 SEO 区覆盖。
# 首次启动导入 settings 表后以后台「SEO」Tab 为准（热更新）；代码注入（inject）仅入库不入本文件。
seo:
  default_description: ''   # 默认 meta description（文章级未配置时的回退值；再回退站点 description）
  default_keywords: ''      # 默认 meta keywords，逗号分隔
  robots_extra: ''          # robots.txt 附加规则（多行原样追加，如 "Disallow: /draft"）
  no_index: false           # true=全站输出 noindex meta（建站期防收录）
  google_verification: ''   # google-site-verification 验证码
  bing_verification: ''     # msvalidate.01 验证码
  baidu_verification: ''    # baidu-site-verification 验证码

# 评论系统（自建，参考 Artalk 架构 + Halo 设计语言）
comments:
  enabled: true           # 总开关：false 时文章页不渲染评论区、/api/comments 关闭
  title: 评论             # 评论区标题
  moderation: false       # true=先审后发（新评论 pending，管理页通过后公开）；false=直接发布
  admin_email: ''         # 博主邮箱：新评论通知收件人 + 博主身份匹配（该邮箱评论带博主徽章）
  admin_badge: 博主       # 博主徽章文案
  gravatar_mirror: https://weavatar.com/avatar  # Gravatar 镜像基址（头像 = {mirror}/{md5(email)}）
  # 邮件通知（net/smtp）。smtp_host 留空则通知整体关闭；发送失败仅记日志，不影响评论提交
  notify:
    smtp_host: ''
    smtp_port: 465
    username: ''
    password: ''          # 【密钥】SMTP 发信密码/授权码
    from: ''              # 发件人地址，留空用 username

# 前端体验增强配置（Spec 36）。缺省全关，opt-in 启用。
# 首次启动导入 settings 表后以后台「插件」Tab 为准（热更新），与 seo 段同语义。
# 完整示例（各插件 enable 置 true 后按需启用）：
# plugins:
#   preload:
#     enable: true
#     service: flying_pages
#   scrollreveal:
#     enable: true
#     distance: 60px
#     duration: 600
#     interval: 100
#   heti:
#     enable: true
#   fancybox:
#     selector: 'div.lazy-box>img.lazy'
#   card_hover:
#     enable: true
#     spotlight_color: 'rgba(255, 255, 255, 0.25)'
#     max_tilt: 3
plugins:
  preload:
    enable: false
    service: ''            # 预加载服务，如 flying_pages
  scrollreveal:
    enable: false
    distance: 60px
    duration: 600
    interval: 100
  heti:
    enable: false
  fancybox:
    selector: 'div.lazy-box>img.lazy'
  card_hover:
    enable: false
    spotlight_color: 'rgba(255, 255, 255, 0.25)'
    max_tilt: 3

# -------------------------------------------------------------
# 外部数据服务（services）
# -------------------------------------------------------------
# siteinfo：友链卡片图标兜底。sites.js 渲染卡片后，对未配 icon/avatar 的卡片
# 用此 API 补图标。URL 中的 {href} 会被替换为站点链接（encodeURIComponent）。
# 留空（默认）则功能关闭。
services:
  siteinfo:
    api: ''                # 例：https://api.example.com/siteinfo?url={href}
