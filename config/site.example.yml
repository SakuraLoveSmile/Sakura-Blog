# 站点配置模板，对应 internal/config/site.go 的 DefaultSite()。
# 复制为 site.yml 后填值：cp config/site.example.yml config/site.yml
# site.yml 含密钥（admin 密码 / SMTP 密码）、不受 git 跟踪；本 example 仅跟踪结构与安全默认值。
# 启动时由 config.LoadSite 加载；生产模式缺失/解析失败会拒绝启动，只有开发模式回退到 DefaultSite()。
# 注意：# 开头的值（如主题色）必须加引号；raw HTML（如 social icon）用单引号包裹。

title: Stellar Demo
subtitle: Go 服务端渲染
description: 用 Go (Gin) + html/template + goldmark 重建 Stellar 风格博客，验证服务端渲染链路。
# ❗ 生产必填：canonical/OG/sitemap/feed/JSON-LD 均依赖此基址生成绝对 URL。
# 空值时 release 模式启动会告警，并回退 http://<request-host>（搜索引擎可能收录为 http）。
# 示例：url: https://blog.example.com
url: ""
avatar: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
# 头像 hover 旋转背景图，对应原版 style.animated_avatar.background（animate: auto）
avatar_bg: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/rainbow64@3x.webp
logo_title: Stellar Demo
# 含 | 时拆 normal/hover 两段，鼠标 hover 标题时向上滚动切换（原版 logo.ejs 机制）
logo_sub: Go SSR 验证|Stellar 主题

menubar:
  columns: 2
  items:
    - id: post
      title: 博客
      url: /
      icon: default:documents
      theme: "#1BCDFC"
    - id: wiki
      title: 文库
      url: /wiki
      icon: example:notebook
      theme: "#3DC550"
    - id: notes
      title: 笔记
      url: /notes
      icon: default:edit
      theme: "#FA7D23"
    - id: friends
      title: 友链
      url: /friends
      icon: example:planet
      theme: "#FF6B9D"

# 右栏（site.yml rightbar 段）
rightbar:
  # 欢迎语卡片内的链接列表（对齐原版 markdown widget 的 linklist）。columns 留空=按链接数
  welcome_linklist:
    items:
      - title: 查看文库
        url: /wiki
        icon: example:notebook
      - title: 传送到笔记
        url: /notes
        icon: default:edit

# 文库项目（配置驱动，不入库）。每个项目一张卡片，点击跳到 url（站内文章/页面或外链）。
# repo（可选）：GitHub 仓库（owner/name 格式），配置后 wiki 文档页右栏渲染 ghrepo 仓库卡片；项目首页正文为空时回退 README。
# branch（可选）：README 所在分支，缺省使用 GitHub HEAD。
# Stellar 1.44 Hero（可选）：项目文档页支持图片背景、Galaxy 动画及二者叠加；
# animation.params 使用 Galaxy 的 camelCase 参数，非法值会在前台安全降级。
# 示例：
#   hero:
#     title: Stellar 文档
#     description: 主题使用指南
#     background: https://example.com/hero.webp
#     animation:
#       type: galaxy
#       params:
#         density: 2
#         speed: 0.5
#         transparent: true
wiki:
  - id: stellar
    title: Stellar 主题文档
    description: Hexo Stellar 主题的使用文档与配置说明。
    icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
    tags: [主题, 前端]
    url: https://xaoxuu.com/wiki/stellar/
    sort: 100
  - id: go-blog
    title: Go 博客重构笔记
    description: 用 Go(Gin)+html/template+goldmark 复刻 Stellar 的实现记录。
    icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/link/8f277b4ee0ecd.svg
    tags: [后端, Go]
    repo: sakurasep/blog
    url: /archives/
    sort: 90
  - id: frontend
    title: 前端拾遗
    description: CSS 变量、PJAX、懒加载等前端细节整理。
    icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
    tags: [前端]
    url: /categories/
    sort: 80

# 友链动态聚合（/friends 页）。refresh_interval：后端抓取友链 RSS 的刷新间隔（分钟），缺省 60。
# posts_per_link：每个友链展示的最新文章数，缺省 20。
friends:
  refresh_interval: 60
  posts_per_link: 20
  # 连通性巡检间隔（分钟），<=0 关闭，缺省 360。
  check_interval: 360
  # 网站截图缓存间隔（分钟），<=0 关闭，缺省 1440。
  snapshot_interval: 1440
  # 外部截图服务 URL 模板，必须包含 {url} 占位。
  snapshot_provider: "https://image.thum.io/get/width/1280/crop/720/{url}"

# 页面级设置（按页面键管理，控制台「页面 → 友链页」可编辑；不配置 = 现状）。
# friends：title 覆盖 /friends 页标题；hero 三要素渲染页首 banner；
# show_posts=false 时只渲染友链卡片、跳过 RSS 文章列表；
# refresh_interval/posts_per_link 留空或 0 回退上面 friends 段同名字段。
